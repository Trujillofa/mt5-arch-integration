# Optional Hyprland snippet for MetaTrader 5 under Wine.
# Include from ~/.config/hypr/hyprland.conf:
#   source = ~/Projects/trading/mt5-arch-integration/ops/hyprland/mt5-window-rules.conf
#
# Hyprland 0.53+ / 0.56 syntax (windowrulev2 is deprecated):
#   windowrule = <props>, match:class ..., match:title ...
# See: https://wiki.hypr.land/Configuring/Basics/Window-Rules/
#      (Omarchy defaults: ~/.local/share/omarchy/default/hypr/windows.conf)
#
# Goals: keep the main terminal visible; reduce ghost process; improve mouse under XWayland.
# Ghost often follows minimize or chart-tab clicks under Wine — recover with:
#   ~/Projects/trading/mt5-arch-integration/scripts/10-recover-terminal.sh --fullscreen

# Float Login dialogs so they stay on top of the main shell
windowrule = float on, match:class ^(terminal64\.exe)$, match:title ^(Login)$
windowrule = center on, match:class ^(terminal64\.exe)$, match:title ^(Login)$
windowrule = no_anim on, match:class ^(terminal64\.exe)$, match:title ^(Login)$

# New Order (F9). Do NOT use `center on` here.
# Measured 2026-08-14: center+no_anim still produced a multi-monitor slide
# (12+ position updates over ~2s, HDMI-A-1 → HDMI-A-2). Wine restores a stale
# position; Hyprland's center then animates toward the focused monitor despite
# no_anim. Float only — leave placement to Wine, which is stable once uncontested.
windowrule = float on, match:class ^(terminal64\.exe)$, match:title ^(Order:)
windowrule = animation off, match:class ^(terminal64\.exe)$, match:title ^(Order:)
windowrule = no_anim on, match:class ^(terminal64\.exe)$, match:title ^(Order:)

# Other non-shell dialogs (EA properties, Expert inputs, Options, …).
# Same: float + no animation, no center (center caused Order to slide across monitors).
# The negative lookahead exempts the main shell (account/server/mode title prefix).
# Recovery for a dialog already lost off-screen:
#   xdotool search --name '<dialog title>' | xargs -I{} xdotool windowmove {} 300 200
windowrule = float on, match:class ^(terminal64\.exe)$, match:title ^(?![0-9]+ - .+ - (Hedge|Netting) - ).*$
windowrule = animation off, match:class ^(terminal64\.exe)$, match:title ^(?![0-9]+ - .+ - (Hedge|Netting) - ).*$
windowrule = no_anim on, match:class ^(terminal64\.exe)$, match:title ^(?![0-9]+ - .+ - (Hedge|Netting) - ).*$

# Prefer not suppressing Wine windows
windowrule = no_shadow on, match:class ^(terminal64\.exe)$

# Prefer main monitor for Wine hit-testing (secondary XWayland monitors often break mouse)
# Comment out if you intentionally want MT5 on the second display permanently.
# windowrule = monitor HDMI-A-2, match:class ^(terminal64\.exe)$

# Do NOT force float on the main shell — maximize uses tiled + fullscreenstate 1.
# Do NOT: workspace special, minimize-to-special, size 0.
# Prefer a dedicated empty workspace for MT5 (e.g. Super+Shift+7) instead of minimize.
