[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-arch"
version = "0.1.0"
description = "MetaTrader 5 integration layer for Arch Linux (Wine + mt5linux/RPyC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trading Team" }]
keywords = ["metatrader5", "mt5", "wine", "archlinux", "trading", "rpyc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mt5linux>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
mt5-arch = "mt5_arch.cli:main"
mt5-arch-window = "mt5_arch.window_ops:main"
mt5-arch-park = "mt5_arch.park_ops:main"

[project.urls]
Homepage = "https://github.com/Trujillofa/mt5-arch-integration"
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mt5_arch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "live: tests that require a running MT5 terminal + mt5server (set MT5_LIVE_SMOKE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Research identifiers are not renamed: E741 (`l`), N803 (`entry_N`/`exit_N`),
# N806 (`X`, `cN`, `L`/`R`), E402 (imports after sys.path inserts).
# N813 is the upstream `import MetaTrader5 as mt5` alias.
# F841, F821 (`_SAVED` NameError), and SIM222 (`... or True`) are left to
# fix/research-script-bugs (https://github.com/Trujillofa/mt5-arch-integration/pull/123).
# SIM113 `done += 1` counters are outside this pass's mechanical allow-list.
"backtest.py" = ["E741"]
"fetch_data.py" = ["E741", "N813"]
"live_trader.py" = ["E741", "N813"]
"scripts/exog_fx_daily_cosign_xau_nextday_paper_gate.py" = ["F841"]
"scripts/htf_fib_core.py" = ["E741"]
"scripts/us_index_session_htf.py" = ["E741"]
"scripts/xau_donchian_null_maxstat.py" = ["E402", "SIM113"]
"scripts/xau_family_audjpy_carry_long_hold.py" = ["F841", "N806"]
"scripts/xau_family_cot_gc_mm_fade_long_or_flat.py" = ["F841"]
"scripts/xau_family_eur_gbp_logspread_ou_fade.py" = ["N806"]
"scripts/xau_family_exog_eur_gbp_tvbeta_xau_long_or_flat.py" = ["N806"]
"scripts/xau_family_fomc_h4_long_only.py" = ["F841"]
"scripts/xau_family_prior_day_high_break.py" = ["E741"]
"scripts/xau_family_xau_eur_logspread_ou_fade.py" = ["F841", "N806"]
"scripts/xau_family_xau_xag_logspread_ou_fade.py" = ["N806"]
"scripts/xau_htf_fib_widen_entries.py" = ["N806"]
"scripts/xau_lane_deep_opt.py" = ["F841", "N803", "SIM222"]
"scripts/xau_new_design_search.py" = ["F841"]
"scripts/xau_null_maxstat.py" = ["E402", "F821", "SIM113"]
"scripts/xau_preregistered_holdout.py" = ["N803"]
"scripts/xau_regime_analysis.py" = ["F841"]
"scripts/xau_train_only_retrain.py" = ["E402"]
"scripts/xau_walkforward.py" = ["E402", "F841"]
